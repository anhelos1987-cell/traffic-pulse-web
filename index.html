<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0b1324">
  <meta name="color-scheme" content="dark">
  <title>Traffic Pulse</title>
  <link rel="stylesheet" href="style.css?v=M197-VK-RC1-HF3">
  <!-- VK Play browser release: static HTTPS iframe build; no embedded advertising SDK. -->
</head>
<body>
  <main id="app" class="app" aria-label="Traffic Pulse">
    <header class="topbar">
      <div class="brand" aria-label="Traffic Pulse">
        <span class="brand-mark" aria-hidden="true"><i></i></span>
        <span class="brand-name">Traffic Pulse</span>
      </div>
      <div class="hud">
        <button id="coin-btn" class="pill pill-button" type="button" aria-label="Garage"><span aria-hidden="true">🪙</span><strong id="coins">0</strong></button>
        <div class="pill" title="Stars"><span aria-hidden="true">⭐</span><strong id="total-stars">0</strong></div>
        <button id="map-btn" class="icon-btn" type="button" aria-label="Карта кампании">🗺️</button>
        <button id="daily-btn" class="icon-btn ui-hidden" type="button" aria-label="Режимы">🎮</button>
        <button id="pause-btn" class="icon-btn" type="button" aria-label="Pause" aria-keyshortcuts="Escape">Ⅱ</button>
      </div>
    </header>

    <section class="level-head">
      <div class="level-copy">
        <div id="district" class="eyebrow">GREEN TOWN</div>
        <h1 id="level-label">Уровень 1</h1>
      </div>
      <div class="goal">
        <div class="goal-row">
          <span id="goal-text">Пропусти весь транспорт</span>
          <strong id="event-badge" class="event-badge ui-hidden"></strong><strong id="weather-badge" class="weather-badge ui-hidden"></strong><strong id="mission-badge" class="mission-badge ui-hidden"></strong><strong id="priority-badge" class="priority-badge ui-hidden" aria-live="polite" aria-atomic="true"></strong><button id="record-badge" class="record-badge ui-hidden" type="button" aria-label="Personal best comparison"></button><strong id="flow-badge" class="flow-badge">FLOW</strong>
        </div>
        <div class="progress" role="progressbar" aria-label="Level progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-bar"></span></div>
      </div>
    </section>

    <section class="game-card" aria-label="Traffic control board">
      <canvas id="game" width="900" height="900" aria-label="Traffic intersection game" aria-describedby="goal-text phase-label"></canvas>
      <div id="toast" class="toast" aria-live="polite"></div>
      <div id="tap-hint" class="tap-hint" role="status" aria-live="polite" aria-atomic="true" aria-hidden="true">
        <span>☝</span><b id="tap-hint-text">Нажми на светофор</b>
      </div>
      <div id="phase-indicator" class="phase-indicator" aria-live="polite">
        <i></i><b id="phase-label">Горизонталь</b>
      </div>
    </section>

    <section id="controls-panel" class="controls" aria-label="Game controls">
      <button id="restart-btn" class="control secondary" type="button" aria-keyshortcuts="R"><span aria-hidden="true">↻</span><b data-i18n="restart">Заново</b></button>
      <button id="signal-btn" class="control signal" type="button" aria-keyshortcuts="Space">
        <span class="signal-icon" aria-hidden="true"><i class="red"></i><i class="yellow"></i><i class="green"></i></span>
        <b id="signal-label">Сменить свет</b>
      </button>
      <div id="greenwave-controls" class="greenwave-controls ui-hidden" role="group" aria-label="Independent intersection controls">
        <button id="signal-j0-btn" class="control signal junction-control" type="button" aria-label="Left intersection" aria-keyshortcuts="1">
          <span class="junction-key" aria-hidden="true">1</span>
          <span class="signal-icon" aria-hidden="true"><i class="red"></i><i class="yellow"></i><i class="green"></i></span>
          <b id="signal-j0-label">Левый</b>
        </button>
        <button id="signal-j1-btn" class="control signal junction-control" type="button" aria-label="Right intersection" aria-keyshortcuts="2">
          <span class="junction-key" aria-hidden="true">2</span>
          <span class="signal-icon" aria-hidden="true"><i class="red"></i><i class="yellow"></i><i class="green"></i></span>
          <b id="signal-j1-label">Правый</b>
        </button>
      </div>
      <button id="hint-btn" class="control secondary" type="button"><span aria-hidden="true">💡</span><b data-i18n="hint">Совет</b></button>
      <aside id="desktop-insight" class="desktop-insight" aria-label="Progress overview">
        <div class="insight-title" id="insight-title">Ближайшие цели</div>
        <div class="insight-row"><span>🚗</span><b id="insight-car">—</b></div>
        <div class="insight-row"><span>⭐</span><b id="insight-stars">—</b></div>
        <div class="insight-row"><span>⚡</span><b id="insight-flow">—</b></div>
        <div class="insight-row"><span>🎯</span><b id="insight-mission">—</b></div>
      </aside>
    </section>

    <footer class="mini-status">
      <span id="queue-label">Пробка: 0/4</span>
      <span id="switch-label">Переключения: 0</span>
    </footer>
  </main>

  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-title" aria-describedby="modal-text">
    <div class="modal" tabindex="-1">
      <div id="modal-kicker" class="eyebrow">TRAFFIC PULSE</div>
      <h2 id="modal-title">Пауза</h2>
      <p id="modal-text"></p>
      <div id="modal-stars" class="modal-stars" aria-label="Stars"></div>
      <div id="modal-reward" class="reward hidden"></div>
      <div id="modal-extra" class="modal-extra hidden"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <script src="https://vkplay.ru/app/50363/static/mailru.core.js"></script>
  <script src="app.js?v=M197-VK-RC1-HF3"></script>
</body>
</html>
