name: VK Games validation
on:
  push:
    branches: [vk-games]
  pull_request:
    branches: [main, vk-games]
jobs:
  vk-games-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all shipping JavaScript
        run: |
          node --check app.js
          node --check progress-core.js
          node --check vkbridge.min.js
          node --check vk-games.js
          node --check campaign-access.js
          node --check player-guidance-core.js
          node --check payments-config.js
          node --check vk-purchases.js
          node --check server/vk-payments.mjs
          node --check infra/cloudflare-vkgames-worker.js
      - name: Enforce VK Games privacy boundary
        run: |
          ! grep -q "traffic-pulse-billing" app.js
          ! grep -q "unpkg.com" index.html
          grep -q "connect-src https://functions.yandexcloud.net/d4eo58crqj6cu6fk4hmg;" index.html
          ! grep -Eq "\\bfetch\\s*\\(" vk-games.js
          grep -q "cloudflarePlayerStorage:false" vk-games.js
      - name: Validate Russian payment handler
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate VK cloud saves, account isolation, deletion and ads
        run: node --test tests/*.test.mjs
      - name: Report M205 frame hot-path microbenchmark (informational)
        run: node scripts/benchmark-m205-hotpaths.mjs
      - name: Validate browser smoke script syntax
        run: node --check scripts/browser-smoke-vkgames.mjs
      - name: Browser smoke (real headless Chrome, local-only platform fallback)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24.26.1
          node scripts/browser-smoke-vkgames.mjs
      - name: Validate VK/OK test package script syntax
        run: node --check scripts/package-vkgames-test-build.mjs
      - name: Package minimal VK/OK test build (ZIP + SHA-256 manifest)
        run: node scripts/package-vkgames-test-build.mjs
      - name: Upload M212 playable static test candidate
        uses: actions/upload-artifact@v4
        with:
          name: traffic-pulse-m214-test-build
          path: |
            artifacts/TrafficPulse_M214_VKOK_TestBuild.zip
            artifacts/TrafficPulse_M214_VKOK_TestBuild_manifest.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload browser screenshots for manual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-pulse-m214-browser-smoke
          path: artifacts/browser-smoke/*.png
          retention-days: 7
          if-no-files-found: warn
